source: '../../depot/box2d/include/box2d/id.h'
target: 'src/id_py_auto.cpp'
language: c

specs:
  # 'function_prototype@b2OverlapResultFcn':
  #   facade:
  #     kind: callback
  #     context_param: context

  'struct@b2WorldId':
    pyname: World
    extra:
      methods:
        __init__:
          use: function@b2CreateWorld
        draw:
          use: function@World_Draw

  'struct@b2BodyId':
    pyname: Body
    extra:
      properties:
        user_data:
          setter: "function@Body_SetUserData"
          getter: "function@Body_GetUserData"
        mass_data:
          setter: "function@b2Body_SetMassData"
          getter: "function@b2Body_GetMassData"
        position:
          setter: "function@Body_SetPosition"
          getter: "function@b2Body_GetPosition"
        rotation:
          getter: "function@b2Body_GetRotation"
        angle:
          getter: "function@Body_GetAngle"
        transform:
          setter: "function@b2Body_SetTransform"
          getter: "function@b2Body_GetTransform"
        linear_velocity:
          setter: "function@b2Body_SetLinearVelocity"
          getter: "function@b2Body_GetLinearVelocity"
        angular_velocity:
          setter: "function@b2Body_SetAngularVelocity"
          getter: "function@b2Body_GetAngularVelocity"

  'struct@b2ShapeId':
    pyname: Shape
    extra:
      properties:
        user_data:
          setter: "function@Shape_SetUserData"
          getter: "function@Shape_GetUserData"
        body:
          getter: function@b2Shape_GetBody
        friction:
          setter: "function@b2Shape_SetFriction"
          getter: "function@b2Shape_GetFriction"        
        restitution:
          setter: "function@b2Shape_SetRestitution"
          getter: "function@b2Shape_GetRestitution"
        user_material:
          setter: "function@b2Shape_SetUserMaterial"
          getter: "function@b2Shape_GetUserMaterial"


transforms:
  - name: mogrify
    target: struct@b2WorldId

  - name: mogrify
    target: struct@b2BodyId

  - name: mogrify
    target: struct@b2ShapeId