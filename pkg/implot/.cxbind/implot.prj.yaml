module: implot

language: c++

flags: [
  '-std=c++17',
  '-DIMGUI_DISABLE_OBSOLETE_FUNCTIONS=1',
  '-DIMGUI_DISABLE_OBSOLETE_KEYIO=1',
  '-DIMPLOT_DISABLE_OBSOLETE_FUNCTIONS=1',
  '-I../../depot/imgui'
]

prefixes: [ImPlot, Im]

targets:
  pyi: crunge/implot/_implot.pyi

unit_files:
  - path: implot.unit.yaml
