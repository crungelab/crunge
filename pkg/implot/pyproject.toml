[build-system]
requires = ["cxbuild>=0.4"]
build-backend = "cxbuild.backend"

[tool.setuptools]
packages = ["crunge", "crunge.implot"]

[project]
name = "crunge-implot"
version = "0.1.0"
description = 'Crunge ImPlot Extension'
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = []
authors = [{ name = "Kurtis Fields", email = "kurtisfields@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

[tool.cxbuild.extension]
name="crunge.implot._implot"

