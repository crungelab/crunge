[build-system]
requires = ["cxbuild>=0.4"]
build-backend = "cxbuild.backend"

[tool.setuptools]
packages = ["crunge", "crunge.imgui"]

[project]
name = "crunge-imgui"
version = "0.1.0"
description = "Crunge ImGui Extension"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = []
authors = [{ name = "Kurtis Fields", email = "kurtisfields@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest", "mypy"]

[tool.cxbuild.extension]
name = "crunge.imgui._imgui"