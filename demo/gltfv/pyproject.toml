[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gltfv"
version = "0.1.0"
description = 'Crunge WebGPU/GLTF Demo'
requires-python = ">=3.12"
authors = [{ name = "Kurtis Fields", email = "kurtisfields@gmail.com" }]

dependencies = [
    "click ==8.1.7",
    "glfw ==2.10.2",
    "Jinja2 ==3.1.4",
]

[project.scripts]
gltfv = 'gltfv.cli:cli'

[tool.hatch.envs.default]
python = "3.12"
installer = "uv"
workspace.members = [
  # Build toolchain
  "../../../cxbuild",
  # Generation toolchain (cxbuild requirement)
  "../../../cxbind",

  # Crunge packages
  "../../pkg/core", "../../pkg/wgpu",
  "../../pkg/gltf",
]
dependencies = ["uv", "pytest", "mypy"]
