[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdldemo"
version = "0.1.0"
description = 'Crunge SDL Demo'
requires-python = ">=3.12"
authors = [{ name = "Kurtis Fields", email = "kurtisfields@gmail.com" }]

dependencies = [
    "loguru",
    "PyGLM",
    "trimesh",
    "imageio",
]

[tool.hatch.envs.default]
python = "3.12"
installer = "uv"
workspace.members = [
  # Build toolchain
  "../../../cxbuild",
  # Generation toolchain (cxbuild requirement)
  "../../../cxbind",

  # KCore
  "../../../kcore",

  # Crunge packages
  "../../pkg/core", "../../pkg/imgui", "../../pkg/wgpu",
  "../../pkg/sdl",
]
dependencies = ["uv", "pytest", "mypy"]
